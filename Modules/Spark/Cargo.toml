[package]
name = "spark"
version = "1.0.0"
edition = "2021"
description = "Sakshi // Spark: Ephemeral thought capture HUD"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.29", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
