name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OpenSSF Least Privilege Invariant
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Pinned to immutable commit SHA (actions/checkout@v4.2.2)
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1