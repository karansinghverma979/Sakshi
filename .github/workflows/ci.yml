name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OpenSSF Least Privilege Invariant
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Pinned to immutable commit SHA (actions/checkout@v4.2.2)
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2